{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Agregar Videojuego</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}?v=2">
</head>

<body>
<h1>Agregar nuevo videojuego</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}
    <label>Nombre:</label><br>
    <input type="text" name="title" required>
    <br><br>
    <label>Descripción:</label><br>
    <textarea name="description" rows="5" cols="40" required></textarea>
    <br><br>
    <label>Imagen:</label><br>
    <input type="file" name="image" required>
    <br><br>
    <label>Fecha de lanzamiento:</label><br>
    <input type="datetime-local" name="release_date" required>
    <br><br>
    <label>Plataforma:</label><br>
    <input type="text" name="platform" required>
    <br><br>
    <label>Categoría:</label><br>
    <input type="text" name="category" required>
    <br><br>
    <button type="submit">
        Guardar videojuego
    </button>
</form>
<br>
<a href="/">
    Volver al catálogo
</a>

</body>
</html>
